[workspace]
resolver = "3"
members = [
  "libremarkable-utils",
  "rmu"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/carlschader/remarkable-utils"
authors = ["Carl Schader <carlschader@gmail.com>"]

[workspace.dependencies]
libremarkable-utils = { path = "libremarkable-utils", version = "0.1.0" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
rpassword = "7"
indicatif = "0.18"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
